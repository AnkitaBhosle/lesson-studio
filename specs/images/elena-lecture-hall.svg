<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- hall wall -->
  <rect width="800" height="450" fill="#EEF1F6"/>
  <rect y="0" width="800" height="40" fill="#1F2A44"/>
  <!-- wood paneling -->
  <rect y="260" width="800" height="190" fill="#C9A77C"/>
  <g stroke="#B8946A" stroke-width="2">
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="340" x2="800" y2="340"/>
  </g>
  <!-- projection screen -->
  <rect x="270" y="60" width="440" height="230" fill="#ffffff" stroke="#BFC6D3" stroke-width="4"/>
  <rect x="270" y="60" width="440" height="34" fill="#1F2A44"/>
  <text x="290" y="83" font-family="Georgia, serif" font-size="17" fill="#E2B84B">Week 6 · Inside the chloroplast</text>
  <!-- leaf cross-section to chloroplast illustration on screen -->
  <ellipse cx="370" cy="190" rx="70" ry="45" fill="#A9D18E" stroke="#5E8C3A" stroke-width="3"/>
  <line x1="300" y1="190" x2="440" y2="190" stroke="#5E8C3A" stroke-width="3"/>
  <line x1="440" y1="190" x2="520" y2="190" stroke="#8892A6" stroke-width="2" stroke-dasharray="6 5"/>
  <ellipse cx="600" cy="190" rx="80" ry="50" fill="#CFE8B9" stroke="#3F7A2B" stroke-width="3"/>
  <g fill="#5E9E3B" stroke="#2F6020" stroke-width="1.5">
    <rect x="555" y="170" width="22" height="40" rx="5"/>
    <rect x="585" y="165" width="22" height="50" rx="5"/>
    <rect x="615" y="172" width="22" height="36" rx="5"/>
  </g>
  <text x="600" y="262" font-family="Georgia, serif" font-size="13" fill="#1F2A44" text-anchor="middle">thylakoid stacks (grana)</text>
  <text x="690" y="282" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6B7385" text-anchor="end">Source: assigned reading, p.212</text>
  <!-- chalkboard -->
  <rect x="40" y="70" width="190" height="150" fill="#2E4A3E" stroke="#8C6A45" stroke-width="8"/>
  <text x="58" y="110" font-family="Georgia, serif" font-size="15" fill="#F2F2E6">6CO₂ + 6H₂O</text>
  <text x="80" y="135" font-family="Georgia, serif" font-size="15" fill="#F2F2E6">→ C₆H₁₂O₆</text>
  <text x="100" y="160" font-family="Georgia, serif" font-size="15" fill="#F2F2E6">+ 6O₂</text>
  <path d="M58 185 Q 110 200 200 180" fill="none" stroke="#E2B84B" stroke-width="2"/>
  <!-- lectern -->
  <path d="M120 300 L 230 300 L 220 430 L 130 430 Z" fill="#1F2A44"/>
  <rect x="110" y="290" width="130" height="16" rx="3" fill="#2C3A5C"/>
  <rect x="150" y="330" width="50" height="34" rx="4" fill="#E2B84B"/>
  <!-- laptop on lectern -->
  <path d="M140 262 L 205 262 L 212 292 L 133 292 Z" fill="#AEB6C4"/>
  <!-- Dr. Ortiz: body (blazer) -->
  <path d="M215 330 C 215 260, 245 238, 280 238 C 315 238, 345 260, 345 330 L 345 430 L 215 430 Z" fill="#3B4A6B"/>
  <path d="M265 240 L 280 290 L 295 240 Z" fill="#F4F1EA"/>
  <!-- neck/head -->
  <rect x="270" y="212" width="20" height="30" rx="8" fill="#D9A07A"/>
  <ellipse cx="280" cy="190" rx="32" ry="36" fill="#E2AE88"/>
  <!-- hair (bun) -->
  <path d="M248 192 C 245 150, 315 145, 312 192 C 306 172, 290 165, 280 166 C 268 166, 254 172, 248 192 Z" fill="#4A2E22"/>
  <circle cx="298" cy="152" r="14" fill="#4A2E22"/>
  <!-- glasses and face -->
  <circle cx="268" cy="192" r="9" fill="none" stroke="#1F2A44" stroke-width="2.5"/>
  <circle cx="292" cy="192" r="9" fill="none" stroke="#1F2A44" stroke-width="2.5"/>
  <line x1="277" y1="192" x2="283" y2="192" stroke="#1F2A44" stroke-width="2.5"/>
  <path d="M270 210 Q 280 217 290 210" fill="none" stroke="#8A4A34" stroke-width="2.5" stroke-linecap="round"/>
  <!-- arm pointing toward screen with clicker -->
  <path d="M335 270 C 360 250, 385 232, 410 220" fill="none" stroke="#3B4A6B" stroke-width="22" stroke-linecap="round"/>
  <circle cx="418" cy="216" r="11" fill="#E2AE88"/>
  <rect x="424" y="208" width="18" height="9" rx="3" fill="#1F2A44"/>
  <!-- students (foreground silhouettes) -->
  <rect y="390" width="800" height="60" fill="#8A6A48"/>
  <g fill="#2B3550">
    <circle cx="420" cy="380" r="22"/><path d="M390 450 C 390 405, 450 405, 450 450 Z"/>
    <circle cx="510" cy="384" r="20"/><path d="M482 450 C 482 410, 538 410, 538 450 Z"/>
    <circle cx="600" cy="378" r="23"/><path d="M568 450 C 568 404, 632 404, 632 450 Z"/>
    <circle cx="690" cy="386" r="21"/><path d="M660 450 C 660 410, 720 410, 720 450 Z"/>
    <circle cx="770" cy="382" r="22"/><path d="M740 450 C 740 406, 800 406, 800 450 Z"/>
  </g>
  <g fill="#4A5675">
    <circle cx="465" cy="404" r="18"/>
    <circle cx="555" cy="408" r="17"/>
    <circle cx="645" cy="402" r="18"/>
    <circle cx="735" cy="408" r="17"/>
  </g>
</svg>
